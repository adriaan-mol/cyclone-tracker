<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>God's Eye // Cyclone Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="app">
    <header class="hud-header">
      <div>
        <div class="logo">GOD'S EYE</div>
        <div class="subtitle">CYCLONE TRACKING // SW INDIAN OCEAN</div>
      </div>
      <div class="status" id="status">SCANNING...</div>
    </header>

    <div id="demo-banner" class="demo-banner hidden"></div>

    <div id="map"></div>
    <canvas id="radar-overlay"></canvas>

    <div class="hud-panel" id="storm-panel">
      <div class="panel-header">
        <span>ACTIVE TARGETS <span id="count">0</span></span>
        <span id="checked" class="checked"></span>
      </div>

      <div id="warnings"></div>
      <div id="scrubber" class="scrubber hidden">
        <div class="scrub-label"><span>TIME</span><b id="scrub-time">NOW</b></div>
        <input type="range" id="scrub" min="0" max="120" step="1" value="0">
        <div id="scrub-info" class="scrub-info"></div>
      </div>

      <div id="storm-list" class="storm-list"></div>
      <div class="links">
        <a href="http://metservice.intnet.mu/" target="_blank" rel="noopener">MAURITIUS MET SERVICES</a>
        <a href="https://meteofrance.re/fr/cyclone" target="_blank" rel="noopener">RSMC LA REUNION</a>
        <a href="https://www.gdacs.org/" target="_blank" rel="noopener">GDACS</a>
        <a href="https://www.metoc.navy.mil/jtwc/jtwc.html" target="_blank" rel="noopener">JTWC</a>
      </div>
      <div id="source-status" class="source-status"></div>
    </div>

    <div class="scanline"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
