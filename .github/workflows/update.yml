name: update-storms
on:
  schedule:
    # GitHub drops many scheduled runs, so each run polls hourly for ~6 h itself.
    # Meteo-France warnings reach the relay ~1 h after 00/06/12/18 UTC.
    - cron: "12 */6 * * *"
    - cron: "42 2,8,14,20 * * *"   # backup start if one is dropped
  workflow_dispatch:
    inputs:
      passes:
        description: "How many hourly passes (1 = single update)"
        default: "1"
permissions:
  contents: write
concurrency:
  group: update-storms
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 380
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Build, commit if changed, repeat hourly
        env:
          PASSES: ${{ github.event.inputs.passes || '6' }}
        run: |
          git config user.name "cyclone-bot"
          git config user.email "cyclone-bot@users.noreply.github.com"
          for i in $(seq 1 "$PASSES"); do
            git pull --rebase -q || true
            python scripts/build_storms.py | tee build.log || echo "::warning title=Build::pass $i failed"
            echo "::notice title=Storms pass $i::$(tail -1 build.log)"
            bash .github/commit_if_changed.sh
            [ "$i" -lt "$PASSES" ] && sleep 3600
          done
          true
      - name: (old single-pass commit step, kept for reference)
        if: false
        run: |
          DO_COMMIT=$(python - <<'PY'
          import json, hashlib, os, subprocess, time
          d = json.load(open("data/storms.json")); d.pop("generated", None)
          h = hashlib.sha256(json.dumps(d, sort_keys=True).encode()).hexdigest()
          old = open("data/.hash").read().strip() if os.path.exists("data/.hash") else ""
          last = int(subprocess.run(["git", "log", "-1", "--format=%ct"], capture_output=True, text=True).stdout or 0)
          daily = time.time() - last > 20 * 3600  # GitHub delays scheduled runs, so don't rely on one exact hour
          open("data/.hash", "w").write(h)
          print("1" if (h != old or daily) else "0")
          PY
          )
          if [ "$DO_COMMIT" = "1" ]; then
            git config user.name "cyclone-bot"
            git config user.email "cyclone-bot@users.noreply.github.com"
            git add data latest.png
            git status --short
            if git commit -q -m "Storm update $(date -u +%Y-%m-%dT%H:%MZ)"; then
              git pull --rebase -q
              git push
              echo "::notice title=Commit::pushed storm update"
            else
              echo "::warning title=Commit::nothing to commit"
            fi
          else
            echo "::notice title=Commit::no change in storm data"
          fi
