name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          {
          J=https://www.metoc.navy.mil/jtwc/products
          for f in wp2726.tcw wp2726web.txt wp2826.tcw wp2826web.txt ep2026.tcw abioweb.txt; do curl -sS -A "$UA" -o jtwc_$f -w "$f %{http_code} %{size_download}\n" "$J/$f"; done
          for ts in 20240114063855 20240114220947 20240115062430 20240115110449 20240116010351 20240125010556 20240221164021; do
            curl -sS -o mms_$ts.html -w "mms $ts %{http_code} %{size_download}\n" "https://web.archive.org/web/${ts}id_/http://metservice.intnet.mu/cyclone-bulletin-english-mauritius.php"; sleep 2; done
          curl -sS "https://web.archive.org/cdx/search/cdx?url=s3.amazonaws.com/www.metoc.navy.mil/jtwc/products/sh*&from=202401&to=202604&output=json&limit=200" -o cdx_jtwc3.json -w "cdx jtwc3 %{http_code}\n"
          head -c 600 cdx_jtwc3.json; echo
          } 2>&1 | tee log.txt
      - name: Commit samples
        run: |
          cd out
          rm -f jar.txt
          sed -i 's/eyJ[A-Za-z0-9._-]*/REDACTED/g' log.txt
          git init -q -b probe-samples
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -A; git commit -qm samples
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-samples
