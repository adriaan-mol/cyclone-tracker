name: probe-feeds
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch samples
        run: |
          pip install shapely >/dev/null
          mkdir -p out/ep && cd out
          curl -sSL -o ne.zip https://naciscdn.org/naturalearth/10m/cultural/ne_10m_admin_0_countries.zip || curl -sSL -o ne.zip https://www.naturalearthdata.com/http//www.naturalearthdata.com/download/10m/cultural/ne_10m_admin_0_countries.zip
          ls -la ne.zip
          pip install pyshp >/dev/null
          python3 - <<'PY'
          import zipfile,shapefile,json
          from shapely.geometry import shape,box,mapping
          z=zipfile.ZipFile('ne.zip'); z.extractall('ne')
          import glob
          r=shapefile.Reader(glob.glob('ne/*.shp')[0])
          fields=[f[0] for f in r.fields[1:]]
          clip=box(25,-45,95,5)
          feats=[]
          for sr in r.iterShapeRecords():
              rec=dict(zip(fields,sr.record))
              g=shape(sr.shape.__geo_interface__)
              if not g.intersects(clip): continue
              g=g.intersection(clip).simplify(0.01,preserve_topology=True)
              if g.is_empty: continue
              feats.append({"type":"Feature","properties":{"name":rec.get("NAME") or rec.get("ADMIN"),"iso3":rec.get("ADM0_A3")},"geometry":mapping(g)})
          json.dump({"type":"FeatureCollection","features":feats},open('region-land.geojson','w'))
          print(len(feats),[f['properties']['name'] for f in feats])
          PY
          rm -rf ne ne.zip
          B=https://www.gdacs.org/gdacsapi/api/polygons/getgeometry
          for ep in $(seq 1 27); do curl -sS "$B?eventtype=TC&eventid=1001041&episodeid=$ep" -o ep/belal_$ep.json; done
          for ep in $(seq 1 47); do curl -sS "$B?eventtype=TC&eventid=1001256&episodeid=$ep" -o ep/gezani_$ep.json; done
          du -sh ep
      - name: Commit samples to probe branch
        run: |
          cd out
          git init -q -b probe-samples
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -A; git commit -qm samples
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-samples
